[package]
name = "document-assistant-desktop"
version = "0.1.0"
description = "Document Assistant Windows Desktop App"
authors = ["Document Assistant Team"]
edition = "2021"

[lib]
name = "document_assistant_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
